<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>Recepción · Planilla</title>
  <link rel="icon" href="/icono-192.png">
  <link rel="manifest" href="/manifest.json?para=recepcion-planilla">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>RECEPCIÓN</h1>
      <div class="migas" id="migas"></div>
      <button class="btn-txt inicio" id="btn-inicio" hidden>← Inicio</button>
      <button class="btn-txt" id="btn-volver" hidden>Volver</button>
      <button class="btn-txt" id="btn-reiniciar" hidden>Cambiar</button>
      <div class="estado" id="estado"><span class="punto"></span><span id="estado-txt">En línea</span></div>
    </header>

    <section class="paso" id="paso-operario">
      <p class="pregunta">¿Quién sos?</p>
      <div class="opciones" id="op-operarios"></div>
    </section>

    <!-- LA PLANILLA.
         Reemplaza al asistente paso a paso de /recepcion.html para este puesto: acá se
         copian 6 a 10 entregas seguidas de un ticket, y lo que hace falta es ver el
         conjunto —qué falta, cuánto va— no un botón grande por vez. -->
    <section class="paso" id="paso-planilla" hidden>
      <div class="franja-recepcion">
        <button class="btn-fecha" id="btn-fecha">Hoy</button>
        <div class="ultimo" id="ultimo-cargado"></div>
      </div>

      <div class="planilla" id="planilla"></div>

      <div class="pie-planilla">
        <div class="pie-dato destacado"><span id="total-litros">0</span><small>litros del día</small></div>
        <div class="pie-dato"><span id="contador-tambos">0 / 0</span><small>tambos cargados</small></div>
        <button class="btn-obs" id="btn-ocasional">+ Otros tambos</button>
      </div>
    </section>

    <!-- Una celda abierta: litros y temperatura JUNTOS.
         La temperatura está cargada en el 100% de las entregas y es control de calidad;
         sacarla para simplificar la planilla sería perder el dato. Acá no estorba: son
         dos casillas y un solo teclado, y con el numpad se pasa de una a otra con Enter. -->
    <section class="paso" id="paso-carga" hidden>
      <p class="pregunta" id="titulo-carga">Cargar entrega</p>
      <div class="centrado">
        <div class="dos-campos">
          <button class="campo" id="campo-litros">
            <span class="valor vacio" id="litros-valor">0</span>
            <span class="unidad">litros</span>
          </button>
          <button class="campo" id="campo-temp">
            <span class="valor vacio" id="temp-valor">0,0</span>
            <span class="unidad">grados</span>
          </button>
        </div>
        <div class="teclado" id="teclado-carga"></div>
        <div class="acciones-observacion">
          <button class="btn-obs" id="btn-obs-carga">Agregar una observación</button>
          <button class="btn-obs suave" id="btn-borrar-entrega" hidden>Borrar esta entrega</button>
        </div>
      </div>
    </section>

    <!-- Los mismos pasos que la pantalla actual, sin cambios de criterio. -->
    <section class="paso" id="paso-fecha" hidden>
      <p class="pregunta">¿De qué día es la entrega?</p>
      <div class="opciones" id="op-fechas"></div>
      <div class="otra-fecha">
        <label for="fecha-libre">¿Otro día?</label>
        <input type="date" id="fecha-libre">
        <button class="btn-obs principal" id="btn-fecha-libre">Usar esta fecha</button>
        <span class="nota-limite" id="limite-fecha"></span>
      </div>
    </section>

    <section class="paso" id="paso-ocasional" hidden>
      <p class="pregunta">¿De qué tambo viene esta entrega?</p>
      <div class="opciones" id="op-ocasionales"></div>
      <p class="nota-limite" id="aviso-ocasional"></p>
    </section>

    <section class="paso" id="paso-observacion" hidden>
      <p class="pregunta">¿Qué pasó con esta entrega?</p>
      <div class="opciones" id="op-motivos"></div>
      <div class="acciones-observacion">
        <button class="btn-obs" id="btn-escribir">Escribir una nota</button>
        <button class="btn-obs suave" id="btn-sin-observacion">Quitar la observación</button>
      </div>
    </section>

    <section class="paso" id="paso-nota" hidden>
      <p class="pregunta">Escribí la observación</p>
      <div class="centrado">
        <div class="nota-valor vacio" id="nota-valor">…</div>
        <div class="teclado-letras" id="teclado-nota"></div>
        <div class="acciones-observacion">
          <button class="btn-obs principal" id="btn-nota-ok">GUARDAR</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="/recepcion-planilla.js"></script>
</body>
</html>
