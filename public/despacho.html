<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos · Despacho</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --surface: #fcfcfb; --plane: #f9f9f7;
      --ink: #0b0b0b; --ink-2: #52514e; --ink-muted: #898781;
      --grid: #e1e0d9; --axis: #c3c2b7; --borde: rgba(11,11,11,.10);
      --acento: #2a78d6; --ok: #0ca30c; --alerta: #c4562f;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --surface: #1a1a19; --plane: #0d0d0d;
        --ink: #fff; --ink-2: #c3c2b7; --ink-muted: #898781;
        --grid: #2c2c2a; --axis: #383835; --borde: rgba(255,255,255,.10);
        --acento: #3987e5;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--plane); color: var(--ink);
           font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 20px 70px; }
    header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { font-size: 23px; margin: 0; }
    .sub { color: var(--ink-2); font-size: 14px; }
    .vivo { margin-left: auto; font-size: 13px; color: var(--ink-muted); display: flex; align-items: center; gap: 7px; }
    .pulso { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    @keyframes late { 50% { opacity: .25 } }
    .pulso.activo { animation: late 2s infinite; }

    .columnas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 980px) { .columnas { grid-template-columns: 1fr; } }
    .col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .9px;
              color: var(--ink-muted); margin: 0 0 10px; font-weight: 700; }

    .pedido {
      background: var(--surface); border: 1px solid var(--borde);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 11px;
    }
    .pedido.listo { border-color: var(--ok); border-width: 2px; }
    .pedido .top { display: flex; align-items: baseline; gap: 10px; }
    .pedido .cliente { font-size: 18px; font-weight: 700; flex: 1; }
    .pedido .hora { font-size: 12.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
    .pedido .cifras { display: flex; gap: 18px; margin: 9px 0 4px; align-items: baseline; }
    .pedido .kilos { font-size: 27px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .pedido .kilos small { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-left: 3px; }
    .pedido .piezas { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .pedido .quien { font-size: 12.5px; color: var(--ink-muted); }
    .pedido details { margin-top: 8px; }
    .pedido summary { font-size: 13px; color: var(--acento); cursor: pointer; }
    .pedido table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 7px; }
    .pedido td, .pedido th { padding: 5px 6px; border-bottom: 1px solid var(--grid); text-align: left; }
    .pedido th { font-size: 11px; text-transform: uppercase; color: var(--ink-muted); letter-spacing: .5px; }
    .pedido td.num, .pedido th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .difiere { color: var(--alerta); font-weight: 700; }

    .acciones { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
    button {
      font: 600 13.5px system-ui, sans-serif; padding: 9px 15px; cursor: pointer;
      background: var(--surface); color: var(--ink);
      border: 1px solid var(--axis); border-radius: 8px;
    }
    button:hover { background: var(--plane); }
    button.principal { background: var(--ok); border-color: var(--ok); color: #fff; }
    button.nuevo { background: var(--acento); border-color: var(--acento); color: #fff; }
    .vacio { color: var(--ink-muted); font-size: 14px; padding: 22px 6px; }

    dialog {
      border: 1px solid var(--borde); border-radius: 12px; padding: 0;
      background: var(--surface); color: var(--ink); max-width: 560px; width: 92vw;
    }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    .modal { padding: 22px 24px 20px; }
    .modal h3 { margin: 0 0 14px; font-size: 18px; }
    .campo { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    select, input[type=number] {
      font: inherit; font-size: 14px; padding: 8px 10px; color: var(--ink);
      background: var(--surface); border: 1px solid var(--axis); border-radius: 7px;
    }
    input[type=number] { width: 92px; }
    .lineas-nuevas { margin: 10px 0; font-size: 14px; }
    .lineas-nuevas div { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--grid); }
    .lineas-nuevas span { flex: 1; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pedidos · Despacho</h1>
    <span class="sub">Lácteos Belgrano</span>
    <span class="vivo"><span class="pulso activo" id="pulso"></span><span id="vivo-txt">actualizando cada 5 s</span></span>
  </header>

  <div class="campo" style="margin-bottom:16px">
    <button class="nuevo" id="btn-nuevo">+ Nuevo pedido</button>
    <span class="sub" id="resumen"></span>
  </div>

  <div class="columnas">
    <div class="col">
      <h2>Pendientes de armar</h2>
      <div id="col-pendiente"></div>
    </div>
    <div class="col">
      <h2>En armado</h2>
      <div id="col-armando"></div>
    </div>
    <div class="col">
      <h2>Listos para facturar</h2>
      <div id="col-listo"></div>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="modal">
    <h3>Nuevo pedido</h3>
    <div class="campo">
      <label for="cliente">Cliente</label>
      <select id="cliente"></select>
    </div>
    <div class="campo">
      <label for="queso">Queso</label>
      <select id="queso"></select>
      <input type="number" id="cantidad" min="1" value="1" aria-label="Piezas">
      <button id="btn-add">Agregar</button>
    </div>
    <div class="lineas-nuevas" id="lineas-nuevas"></div>
    <div class="acciones">
      <button class="principal" id="btn-crear">Crear y enviar a la tablet</button>
      <button id="btn-cancelar">Cancelar</button>
    </div>
  </div>
</dialog>

<script type="module" src="/despacho.js"></script>
</body>
</html>
