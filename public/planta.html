<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>Planta · Producción</title>
  <link rel="icon" href="/icono-192.png">
  <link rel="manifest" href="/manifest.json?para=planta">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>PLANTA</h1>
      <div class="migas" id="migas"></div>
      <div class="estado" id="estado"><span class="punto"></span><span id="estado-txt">En línea</span></div>
    </header>

    <!-- Esta pantalla NO es el lanzador de /index.html, que es para el escritorio del
         encargado. Es una tablet más: botones del mismo tamaño que el resto, porque la
         toca la misma persona con los mismos guantes.

         Existe para que una sola tablet pueda atender dos sectores que están uno al lado
         del otro —quesería y saladero— sin que ninguno pierda su flujo. -->
    <section class="paso" id="paso-sector">
      <p class="pregunta">¿Qué vas a cargar?</p>
      <div class="opciones" id="op-sectores"></div>

      <!-- Un sector mal escrito en la URL del kiosco desaparecía sin decir nada, y en una
           tablet amurada eso es medio sector sin poder cargar y nadie sabiendo por qué.
           Acá se ve qué nombre no se entendió y cuáles son los válidos. -->
      <p class="aviso-provisorio" id="aviso-sectores" hidden></p>
    </section>
  </div>

  <script type="module" src="/planta.js"></script>
</body>
</html>
