<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>Pedidos · Armado y pesaje</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>PEDIDOS</h1>
      <div class="migas" id="migas"></div>
      <button class="btn-txt" id="btn-volver" hidden>Volver</button>
      <button class="btn-txt" id="btn-reiniciar" hidden>Cambiar</button>
      <div class="estado" id="estado"><span class="punto"></span><span id="estado-txt">En línea</span></div>
    </header>

    <!-- 1. quien -->
    <section class="paso" id="paso-operario">
      <p class="pregunta">¿Quién sos?</p>
      <div class="opciones" id="op-operarios"></div>
    </section>

    <!-- 2. lista de pedidos -->
    <section class="paso" id="paso-lista" hidden>
      <p class="pregunta">Pedidos para armar</p>
      <div class="columna" id="lista-pedidos"></div>
      <button class="opcion nuevo" id="btn-nuevo">+ ARMAR UN PEDIDO NUEVO</button>
    </section>

    <!-- 3. armado: lineas del pedido -->
    <section class="paso" id="paso-armado" hidden>
      <p class="pregunta" id="titulo-armado">Pedido</p>
      <div class="columna" id="lista-lineas"></div>
      <div class="pie-total">
        <!-- Las unidades son dinámicas: un pedido puede ser de queso (piezas y kilos),
             de leche (bultos y litros) o mixto. -->
        <div class="pie-dato"><span id="total-piezas">0</span><small id="total-piezas-u">preparado</small></div>
        <div class="pie-dato destacado"><span id="total-kilos">—</span><small id="total-kilos-u">total</small></div>
        <button class="btn-cerrar" id="btn-cerrar">PEDIDO LISTO</button>
      </div>
    </section>

    <!-- 4. pesaje de una linea -->
    <section class="paso" id="paso-pesaje" hidden>
      <p class="pregunta" id="titulo-pesaje">Pesar</p>
      <div class="pesaje">
        <div class="pesaje-izq">
          <div class="contador balanza">
            <div class="valor" id="peso-valor">0,000</div>
            <div class="unidad">kilos</div>
          </div>
          <div class="teclado" id="teclado-peso"></div>
        </div>
        <div class="pesaje-der">
          <div class="pesadas-titulo">
            Pesadas <strong id="pesadas-n">0</strong> de <span id="pesadas-pedidas">0</span>
          </div>
          <div class="pesadas" id="lista-pesadas"></div>
          <div class="pesadas-total"><span id="linea-kilos">0,000</span> kg</div>
        </div>
      </div>
    </section>

    <!-- 4b. contar: leche y yogur no se pesan, se cuentan.
         Misma forma que el pesaje para que el operario no tenga que aprender dos
         pantallas, pero sin balanza: acá el número son cajones o unidades. -->
    <section class="paso" id="paso-contar" hidden>
      <p class="pregunta" id="titulo-contar">Contar</p>
      <div class="pesaje">
        <div class="pesaje-izq">
          <div class="contador">
            <div class="valor cero" id="contar-valor">0</div>
            <div class="unidad" id="contar-unidad">bultos</div>
          </div>
          <div class="teclado" id="teclado-contar"></div>
        </div>
        <div class="pesaje-der">
          <div class="pesadas-titulo">
            Preparado <strong id="contar-n">0</strong> de <span id="contar-pedidas">0</span>
          </div>
          <div class="pesadas" id="lista-cargas"></div>
          <div class="pesadas-total"><span id="linea-litros"></span></div>
        </div>
      </div>
    </section>

    <!-- 5. alta de pedido nuevo -->
    <section class="paso" id="paso-cliente" hidden>
      <p class="pregunta">¿Para qué cliente?</p>
      <div class="opciones" id="op-clientes"></div>
    </section>

    <section class="paso" id="paso-nuevo-queso" hidden>
      <p class="pregunta">¿Qué queso lleva?</p>
      <div style="overflow-y:auto; flex:1; min-height:0" id="op-quesos-nuevo"></div>
      <div class="pie-total" id="pie-nuevo" hidden>
        <div class="pie-dato"><span id="nuevo-lineas">0</span><small>líneas cargadas</small></div>
        <button class="btn-cerrar" id="btn-crear">CREAR PEDIDO</button>
      </div>
    </section>

    <section class="paso" id="paso-nuevo-cant" hidden>
      <p class="pregunta" id="titulo-nuevo-cant">¿Cuántas piezas?</p>
      <div class="centrado">
        <div class="contador">
          <div class="valor vacio" id="cant-valor">0</div>
          <div class="unidad">piezas</div>
        </div>
        <div class="teclado" id="teclado-cant"></div>
      </div>
    </section>

    <!-- 6. confirmacion -->
    <section class="paso" id="paso-listo" hidden>
      <div class="confirmacion">
        <div class="tilde">✓</div>
        <div class="titulo" id="listo-titulo">PEDIDO LISTO</div>
        <div class="hora" id="listo-kilos"></div>
        <div class="detalle" id="listo-detalle"></div>
        <div class="acciones-confirmacion">
          <button class="btn-deshacer" id="btn-deshacer">DESHACER · <span id="deshacer-seg">60</span>s</button>
          <button class="btn-seguir" id="btn-seguir">SEGUIR</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="/pedidos.js"></script>
</body>
</html>
